<title>Scanner DTC Automotriz</title>

<style>

/* =================================================
   GENERAL
================================================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    padding: 20px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #080d18;

    color: #f8fafc;
}


.container {

    width: 100%;

    max-width: 750px;

    margin: auto;
}


/* =================================================
   HEADER
================================================= */

header {

    text-align: center;

    margin-bottom: 25px;
}


h1 {

    margin: 0 0 6px;

    color: #ef4444;

    font-size: 30px;
}


.subtitle {

    margin: 0;

    color: #94a3b8;

    font-size: 14px;
}


/* =================================================
   CARDS
================================================= */

.card {

    background: #151e2e;

    border: 1px solid #29364d;

    border-radius: 16px;

    padding: 20px;

    margin-bottom: 20px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.25);
}


/* =================================================
   FORMULARIO
================================================= */

label {

    display: block;

    color: #94a3b8;

    font-size: 13px;

    font-weight: bold;

    margin-bottom: 7px;
}


input,
select {

    width: 100%;

    padding: 14px;

    margin-bottom: 15px;

    background: #0b1220;

    color: white;

    border: 1px solid #334155;

    border-radius: 9px;

    font-size: 16px;

    outline: none;
}


input:focus,
select:focus {

    border-color: #ef4444;
}


button {

    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 9px;

    background: #ef4444;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;
}


button:hover {

    background: #dc2626;
}


button:active {

    transform: scale(.98);
}


button:disabled {

    opacity: .65;

    cursor: wait;
}


/* =================================================
   RESULTADO
================================================= */

#resultado {

    display: none;
}


.codigo {

    display: inline-block;

    background: #ef4444;

    color: white;

    padding: 8px 14px;

    border-radius: 8px;

    font-size: 25px;

    font-weight: bold;
}


.titulo {

    font-size: 21px;

    font-weight: bold;

    margin-top: 14px;

    line-height: 1.3;
}


.marca {

    display: inline-block;

    margin-top: 10px;

    padding: 5px 9px;

    border-radius: 6px;

    background: #334155;

    color: #cbd5e1;

    font-size: 13px;
}


.gravedad {

    display: inline-block;

    margin-top: 10px;

    margin-left: 5px;

    padding: 5px 9px;

    border-radius: 6px;

    background: #f59e0b;

    color: #111827;

    font-size: 13px;

    font-weight: bold;
}


.fuente {

    display: inline-block;

    margin-top: 10px;

    margin-left: 5px;

    padding: 5px 9px;

    border-radius: 6px;

    background: #1e3a8a;

    color: #bfdbfe;

    font-size: 13px;

    font-weight: bold;
}


/* =================================================
   SECCIONES
================================================= */

.seccion {

    margin-top: 22px;
}


.seccion h3 {

    color: #38bdf8;

    border-bottom: 1px solid #334155;

    padding-bottom: 7px;

    margin-bottom: 10px;
}


.seccion p {

    color: #cbd5e1;

    line-height: 1.6;
}


ul,
ol {

    color: #cbd5e1;

    padding-left: 25px;
}


li {

    margin-bottom: 9px;

    line-height: 1.4;
}


/* =================================================
   ESTADOS
================================================= */

.loading {

    text-align: center;

    color: #38bdf8;

    font-weight: bold;

    line-height: 1.6;
}


.error {

    color: #f87171;

    font-weight: bold;

    line-height: 1.6;
}


.warning {

    background: #422006;

    border: 1px solid #92400e;

    padding: 12px;

    border-radius: 8px;

    color: #fed7aa;

    line-height: 1.5;

    word-break: break-word;
}


.success {

    background: #052e1b;

    border: 1px solid #166534;

    padding: 12px;

    border-radius: 8px;

    color: #bbf7d0;

    margin-top: 15px;

    line-height: 1.5;
}


/* =================================================
   FOOTER
================================================= */

footer {

    text-align: center;

    color: #64748b;

    font-size: 12px;

    margin-top: 20px;
}


/* =================================================
   CELULAR
================================================= */

@media(max-width:600px) {

    body {

        padding: 12px;
    }


    .card {

        padding: 16px;
    }


    h1 {

        font-size: 26px;
    }


    .titulo {

        font-size: 19px;
    }

}

</style>

</head>


<body>


<div class="container">

<!-- =================================================

================================================= -->

id="buscarBtn"
type="button"

Scanner DTC Automotriz © 2026

<script>

/* =================================================
   API
================================================= */

const API =
"https://scanner-dtc.vercel.app/api/dtc";


/* =================================================
   ELEMENTOS
================================================= */

const boton =
document.getElementById("buscarBtn");

const codigoInput =
document.getElementById("codigo");

const marcaSelect =
document.getElementById("marca");

const resultado =
document.getElementById("resultado");


/* =================================================
   BUSCAR CÓDIGO
================================================= */

boton.addEventListener(
    "click",
    buscarCodigo
);


async function buscarCodigo() {


    console.log(
        "🔎 BOTÓN PRESIONADO"
    );


    const code =
        codigoInput.value
        .trim()
        .toUpperCase();


    const make =
        marcaSelect.value
        .trim()
        .toLowerCase();


    /* =============================================
       MOSTRAR CONSULTANDO INMEDIATAMENTE
    ============================================= */

    boton.disabled =
        true;


    boton.textContent =
        "🔄 Consultando...";


    resultado.style.display =
        "block";


    resultado.innerHTML = `

        <div class="loading">

            🔄 Consultando servidor...

            <br><br>

            Código:

            <strong>

                ${escaparHTML(
                    code || "..."
                )}

            </strong>

        </div>

    `;


    /* =============================================
       VALIDAR
    ============================================= */

    if (!code) {

        mostrarError(
            "Escribe un código DTC, por ejemplo P0420."
        );

        terminar();

        codigoInput.focus();

        return;

    }


    if (
        !/^[PBCU][0-9A-F]{4}$/.test(
            code
        )
    ) {

        mostrarError(
            "Código inválido. Ejemplos: P0420, P0300 o C0035."
        );

        terminar();

        codigoInput.focus();

        return;

    }


    /* =============================================
       CREAR URL
    ============================================= */

    const url =
        API +
        "/" +
        encodeURIComponent(code) +
        "?make=" +
        encodeURIComponent(make);


    console.log(
        "🌐 URL:",
        url
    );


    try {


        /* =========================================
           FETCH
        ========================================= */

        const response =
            await fetch(
                url,
                {
                    method: "GET",

                    headers: {
                        "Accept":
                            "application/json"
                    },

                    cache:
                        "no-store"
                }
            );


        console.log(
            "HTTP:",
            response.status
        );


        /* =========================================
           LEER RESPUESTA
        ========================================= */

        const text =
            await response.text();


        console.log(
            "RESPUESTA:",
            text
        );


        let data;


        try {

            data =
                JSON.parse(text);

        }

        catch(error) {

            mostrarError(
                "El servidor no devolvió JSON válido."
            );

            return;

        }


        /* =========================================
           ERROR HTTP
        ========================================= */

        if (
            !response.ok
        ) {

            mostrarError(
                data.error ||
                "La API devolvió un error."
            );

            return;

        }


        /* =========================================
           ERROR API
        ========================================= */

        if (
            !data ||
            data.success !== true
        ) {

            mostrarError(
                data.error ||
                "No se pudo obtener información."
            );

            return;

        }


        /* =========================================
           MOSTRAR RESULTADO
        ========================================= */

        mostrarResultado(
            data,
            code,
            make
        );


    }

    catch(error) {


        console.error(
            "FETCH ERROR:",
            error
        );


        resultado.style.display =
            "block";


        resultado.innerHTML = `

            <div class="error">

                ❌ Error al conectar con el servidor.

            </div>

            <br>

            <div class="warning">

                La API no respondió correctamente.

                <br><br>

                <strong>
                    Error:
                </strong>

                ${escaparHTML(
                    error.message
                )}

            </div>

        `;

    }


    finally {

        terminar();

    }

}


/* =================================================
   TERMINAR BÚSQUEDA
================================================= */

function terminar() {

    boton.disabled =
        false;

    boton.textContent =
        "🔎 BUSCAR CÓDIGO";

}


/* =================================================
   MOSTRAR RESULTADO
================================================= */

function mostrarResultado(
    data,
    code,
    make
) {


    const causas =
        convertirLista(
            data.causes
        );


    const sintomas =
        convertirLista(
            data.symptoms
        );


    const diagnostico =
        convertirLista(
            data.diagnosis
        );


    const reparaciones =
        convertirLista(
            data.repairs
        );


    /* =============================================
       FUENTE
    ============================================= */

    let fuente = "";


    if (
        data.source ===
        "supabase"
    ) {

        fuente = `

            <span class="fuente">

                🗄️ Base de datos

            </span>

        `;

    }


    if (
        data.source ===
        "openrouter"
    ) {

        fuente = `

            <span class="fuente">

                🤖 IA

            </span>

        `;

    }


    /* =============================================
       HTML RESULTADO
    ============================================= */

    resultado.style.display =
        "block";


    resultado.innerHTML = `

        <span class="codigo">

            ${escaparHTML(
                data.code ||
                code
            )}

        </span>


        <div class="titulo">

            ${escaparHTML(
                data.title ||
                "Código DTC"
            )}

        </div>


        <span class="marca">

            🚗

            ${escaparHTML(
                data.make ||
                make ||
                "genérica"
            )}

        </span>


        ${
            data.severity
            ?
            `

            <span class="gravedad">

                ⚠️

                ${escaparHTML(
                    data.severity
                )}

            </span>

            `
            :
            ""
        }


        ${fuente}


        <!-- =====================================
             PROBLEMA
        ====================================== -->

        <div class="seccion">

            <h3>

                🔴 Problema

            </h3>


            <p>

                ${escaparHTML(
                    data.problem ||
                    data.description ||
                    "No hay descripción disponible."
                )}

            </p>

        </div>


        <!-- =====================================
             CAUSAS
        ====================================== -->

        <div class="seccion">

            <h3>

                🔍 Causas posibles

            </h3>


            ${crearLista(
                causas
            )}

        </div>


        <!-- =====================================
             SÍNTOMAS
        ====================================== -->

        <div class="seccion">

            <h3>

                🚨 Síntomas

            </h3>


            ${crearLista(
                sintomas
            )}

        </div>


        <!-- =====================================
             DIAGNÓSTICO
        ====================================== -->

        <div class="seccion">

            <h3>

                🧪 Diagnóstico

            </h3>


            ${crearLista(
                diagnostico,
                true
            )}

        </div>


        <!-- =====================================
             REPARACIONES
        ====================================== -->

        <div class="seccion">

            <h3>

                🔧 Posibles arreglos

            </h3>


            ${crearLista(
                reparaciones
            )}

        </div>


        <!-- =====================================
             ÉXITO
        ====================================== -->

        <div class="success">

            ✅ Información obtenida correctamente.

            <br>

            La información mostrada debe utilizarse
            como orientación y confirmarse mediante
            un diagnóstico adecuado del vehículo.

        </div>

    `;

}


/* =================================================
   LISTAS
================================================= */

function convertirLista(
    valor
) {


    if (!valor) {

        return [];

    }


    if (
        Array.isArray(valor)
    ) {

        return valor
            .map(
                item =>
                    String(item).trim()
            )
            .filter(
                Boolean
            );

    }


    if (
        typeof valor ===
        "string"
    ) {

        return valor
            .split("\n")
            .map(
                item =>
                    item.trim()
            )
            .filter(
                Boolean
            );

    }


    return [];

}


/* =================================================
   CREAR LISTA
================================================= */

function crearLista(
    elementos,
    numerada = false
) {


    if (
        !elementos ||
        elementos.length === 0
    ) {

        return `

            <p>

                No hay información disponible.

            </p>

        `;

    }


    const etiqueta =
        numerada
        ?
        "ol"
        :
        "ul";


    return `

        <${etiqueta}>

            ${
                elementos
                    .map(
                        item =>

                        `<li>

                            ${escaparHTML(
                                item
                            )}

                        </li>`

                    )
                    .join("")
            }

        </${etiqueta}>

    `;

}


/* =================================================
   ESCAPAR HTML
================================================= */

function escaparHTML(
    texto
) {


    if (
        texto === null ||
        texto === undefined
    ) {

        return "";

    }


    return String(texto)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =================================================
   ENTER = BUSCAR
================================================= */

codigoInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            boton.click();

        }

    }
);


/* =================================================
   CONVERTIR AUTOMÁTICAMENTE A MAYÚSCULAS
================================================= */

codigoInput.addEventListener(
    "input",
    function() {

        this.value =
            this.value
            .toUpperCase()
            .replace(
                /[^PBCU0-9A-F]/g,
                ""
            )
            .slice(
                0,
                5
            );

    }
);


/* =================================================
   JAVASCRIPT CARGADO
================================================= */

console.log(
    "✅ Scanner DTC cargado correctamente"
);

console.log(
    "API:",
    API
);

</script>
