<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner DTC - Prueba</title>

<style>
body {
    margin: 0;
    padding: 20px;
    background: #080d18;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 700px;
    margin: auto;
}

.card {
    background: #151e2e;
    padding: 20px;
    border-radius: 15px;
}

input, select, button {
    width: 100%;
    padding: 15px;
    margin-bottom: 15px;
    box-sizing: border-box;
    border-radius: 8px;
    font-size: 16px;
}

input, select {
    background: #0b1220;
    color: white;
    border: 1px solid #334155;
}

button {
    border: 0;
    background: #ef4444;
    color: white;
    font-weight: bold;
}

#resultado {
    margin-top: 20px;
    padding: 15px;
    background: #0b1220;
    border-radius: 10px;
    white-space: pre-wrap;
    word-break: break-word;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🚗 Scanner DTC</h1>

<select id="marca">
<option value="chevrolet">Chevrolet</option>
<option value="ford">Ford</option>
<option value="nissan">Nissan</option>
<option value="dodge">Dodge</option>
<option value="toyota">Toyota</option>
<option value="honda">Honda</option>
</select>

<input
    id="codigo"
    type="text"
    placeholder="Ejemplo: P0300"
    maxlength="5"
>

<button id="buscarBtn" type="button">
🔎 BUSCAR CÓDIGO
</button>

<div id="resultado">
Escribe un código y pulsa buscar.
</div>

</div>

</div>

<script>

const API =
"https://scanner-dtc.vercel.app/api/dtc";

const boton =
document.getElementById("buscarBtn");

const codigo =
document.getElementById("codigo");

const marca =
document.getElementById("marca");

const resultado =
document.getElementById("resultado");


boton.addEventListener("click", async function () {

    console.log("BOTON FUNCIONANDO");

    const code =
        codigo.value.trim().toUpperCase();

    const make =
        marca.value;

    if (!code) {

        resultado.textContent =
            "⚠️ Escribe un código DTC.";

        return;

    }

    boton.disabled = true;

    boton.textContent =
        "🔄 Consultando...";

    resultado.textContent =
        "🔄 Consultando servidor...";


    try {

        const url =
            API +
            "/" +
            encodeURIComponent(code) +
            "?make=" +
            encodeURIComponent(make);


        console.log("URL:", url);


        const respuesta =
            await fetch(url);


        const data =
            await respuesta.json();


        console.log(data);


        resultado.textContent =
            JSON.stringify(
                data,
                null,
                2
            );


    }

    catch(error) {

        console.error(error);

        resultado.textContent =
            "❌ ERROR: " +
            error.message;

    }


    boton.disabled = false;

    boton.textContent =
        "🔎 BUSCAR CÓDIGO";

});


codigo.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            boton.click();

        }

    }
);

</script>

</body>
</html>
