ul,

/* =========================
   FOOTER
========================= */

footer {

<script>

/*
=================================================
CONFIGURACIÓN DE LA API
=================================================
*/

const API_URL =
"https://scanner-dtc.vercel.app/api/dtc";


/*
=================================================
ELEMENTOS
=================================================
*/

const codigoInput =
    document.getElementById("codigo");

const marcaSelect =
    document.getElementById("marca");

const resultado =
    document.getElementById("resultado");

const boton =
    document.getElementById("buscarBtn");


/*
=================================================
BUSCAR CÓDIGO
=================================================
*/

async function buscarCodigo() {

    console.log(
        "BOTÓN PRESIONADO"
    );


    /*
    =============================================
    OBTENER DATOS
    =============================================
    */

    const codigo =
        codigoInput.value
        .trim()
        .toUpperCase();


    const marca =
        marcaSelect.value
        .trim()
        .toLowerCase();


    /*
    =============================================
    CONSULTANDO INMEDIATAMENTE
    =============================================
    */

    boton.disabled = true;

    boton.textContent =
        "🔄 Consultando...";


    resultado.style.display =
        "block";


    resultado.innerHTML = `

        <div class="loading">

            🔄 Consultando servidor...

            <br><br>

            Código:

            <strong>
                ${escaparHTML(
                    codigo || "..."
                )}
            </strong>

        </div>

    `;


    /*
    =============================================
    VALIDAR CÓDIGO
    =============================================
    */

    if (!codigo) {

        mostrarError(
            "Escribe un código DTC, por ejemplo P0420."
        );

        terminarBusqueda();

        codigoInput.focus();

        return;

    }


    /*
    =============================================
    FORMATO DTC
    =============================================
    */

    if (
        !/^[PBCU][0-9A-F]{4}$/.test(
            codigo
        )
    ) {

        mostrarError(
            "Código inválido. Ejemplos: P0420, P0300 o C0035."
        );

        terminarBusqueda();

        codigoInput.focus();

        return;

    }


    /*
    =============================================
    URL
    =============================================
    */

    const url =
        API_URL +
        "/" +
        encodeURIComponent(
            codigo
        ) +
        "?make=" +
        encodeURIComponent(
            marca
        );


    console.log(
        "CONSULTANDO:",
        url
    );


    try {

        /*
        =========================================
        PETICIÓN
        =========================================
        */

        const response =
            await fetch(
                url,
                {
                    method: "GET",

                    headers: {
                        "Accept":
                            "application/json"
                    },

                    cache:
                        "no-store"
                }
            );


        console.log(
            "STATUS:",
            response.status
        );


        /*
        =========================================
        TEXTO
        =========================================
        */

        const texto =
            await response.text();


        console.log(
            "RESPUESTA:",
            texto
        );


        /*
        =========================================
        JSON
        =========================================
        */

        let data;


        try {

            data =
                JSON.parse(
                    texto
                );

        }

        catch(error) {

            mostrarError(

                "El servidor no devolvió JSON válido."

            );

            return;

        }


        /*
        =========================================
        ERROR HTTP
        =========================================
        */

        if (
            !response.ok
        ) {

            mostrarErrorServidor(
                response.status,
                data
            );

            return;

        }


        /*
        =========================================
        ERROR API
        =========================================
        */

        if (
            !data ||
            data.success !== true
        ) {

            mostrarErrorServidor(
                response.status,
                data
            );

            return;

        }


        /*
        =========================================
        MOSTRAR
        =========================================
        */

        mostrarResultado(
            data,
            codigo,
            marca
        );


    }

    catch(error) {

        console.error(
            "ERROR FETCH:",
            error
        );


        resultado.style.display =
            "block";


        resultado.innerHTML = `

            <div class="error">

                ❌ Error al conectar con el servidor.

            </div>

            <br>

            <div class="warning">

                La API no respondió correctamente.

                <br><br>

                <strong>
                    Error:
                </strong>

                ${escaparHTML(
                    error.message
                )}

            </div>

        `;

    }

    finally {

        terminarBusqueda();

    }

}


/*
=================================================
TERMINAR BÚSQUEDA
=================================================
*/

function terminarBusqueda() {

    boton.disabled =
        false;

    boton.textContent =
        "🔎 BUSCAR CÓDIGO";

}


/*
=================================================
MOSTRAR RESULTADO
=================================================
*/

function mostrarResultado(
    data,
    codigo,
    marca
) {


    const causas =
        convertirLista(
            data.causes
        );


    const sintomas =
        convertirLista(
            data.symptoms
        );


    const diagnostico =
        convertirLista(
            data.diagnosis
        );


    const arreglos =
        convertirLista(
            data.repairs
        );


    /*
    =============================================
    FUENTE
    =============================================
    */

    let fuente = "";


    if (
        data.source ===
        "supabase"
    ) {

        fuente = `

            <span class="source">

                🗄️ Base de datos

            </span>

        `;

    }

    else if (
        data.source ===
        "openrouter"
    ) {

        fuente = `

            <span class="source">

                🤖 OpenRouter / IA

            </span>

        `;

    }


    /*
    =============================================
    RESULTADO
    =============================================
    */

    resultado.style.display =
        "block";


    resultado.innerHTML = `

        <span class="codigo">

            ${escaparHTML(
                data.code ||
                codigo
            )}

        </span>


        <div class="titulo">

            ${escaparHTML(
                data.title ||
                "Código DTC"
            )}

        </div>


        <span class="marca">

            🚗

            ${escaparHTML(
                data.make ||
                marca ||
                "genérica"
            )}

        </span>


        ${
            data.severity
            ?
            `

            <span class="gravedad">

                ⚠️

                ${escaparHTML(
                    data.severity
                )}

            </span>

            `
            :
            ""
        }


        ${fuente}


        <!-- =========================
             PROBLEMA
        ========================== -->

        <div class="seccion">

            <h3>

                🔴 Problema

            </h3>


            <p>

                ${escaparHTML(
                    data.problem ||
                    "No hay descripción disponible."
                )}

            </p>

        </div>


        <!-- =========================
             CAUSAS
        ========================== -->

        <div class="seccion">

            <h3>

                🔍 Causas posibles

            </h3>


            ${crearLista(
                causas
            )}

        </div>


        <!-- =========================
             SÍNTOMAS
        ========================== -->

        <div class="seccion">

            <h3>

                🚨 Síntomas

            </h3>


            ${crearLista(
                sintomas
            )}

        </div>


        <!-- =========================
             DIAGNÓSTICO
        ========================== -->

        <div class="seccion">

            <h3>

                🧪 Diagnóstico

            </h3>


            ${crearLista(
                diagnostico,
                true
            )}

        </div>


        <!-- =========================
             REPARACIONES
        ========================== -->

        <div class="seccion">

            <h3>

                🔧 Posibles arreglos

            </h3>


            ${crearLista(
                arreglos
            )}

        </div>


        <!-- =========================
             ÉXITO
        ========================== -->

        <div class="success">

            ✅ Información obtenida correctamente.

        </div>

    `;

}


/*
=================================================
ERROR DEL SERVIDOR
=================================================
*/

function mostrarErrorServidor(
    status,
    data
) {


    let mensaje =
        "El servidor encontró un problema.";


    let detalles =
        "";


    if (
        data &&
        data.error
    ) {

        mensaje =
            data.error;

    }


    if (
        data &&
        data.details
    ) {

        if (
            typeof data.details ===
            "string"
        ) {

            detalles =
                data.details;

        }

        else {

            try {

                detalles =
                    JSON.stringify(
                        data.details,
                        null,
                        2
                    );

            }

            catch(error) {

                detalles =
                    String(
                        data.details
                    );

            }

        }

    }


    resultado.style.display =
        "block";


    resultado.innerHTML = `

        <div class="error">

            ❌ Error del servidor

        </div>

        <br>

        <div class="warning">

            <strong>
                HTTP:
            </strong>

            ${escaparHTML(
                status
            )}

            <br><br>

            <strong>
                Mensaje:
            </strong>

            ${escaparHTML(
                mensaje
            )}

            ${
                detalles
                ?
                `

                <br><br>

                <strong>
                    Detalles:
                </strong>

                <br><br>

                ${escaparHTML(
                    detalles
                )}

                `
                :
                ""
            }

        </div>

    `;

}


/*
=================================================
ERROR NORMAL
=================================================
*/

function mostrarError(
    mensaje
) {


    resultado.style.display =
        "block";


    resultado.innerHTML = `

        <div class="error">

            ⚠️

            ${escaparHTML(
                mensaje
            )}

        </div>

    `;

}


/*
=================================================
CONVERTIR LISTA
=================================================
*/

function convertirLista(
    valor
) {


    if (
        !valor
    ) {

        return [];

    }


    if (
        Array.isArray(
            valor
        )
    ) {

        return valor
            .map(
                elemento =>
                    String(
                        elemento
                    ).trim()
            )
            .filter(
                Boolean
            );

    }


    if (
        typeof valor ===
        "string"
    ) {

        return valor
            .split("\n")
            .map(
                elemento =>
                    elemento.trim()
            )
            .filter(
                Boolean
            );

    }


    return [];

}


/*
=================================================
CREAR LISTA
=================================================
*/

function crearLista(
    elementos,
    numerada = false
) {


    if (
        !elementos ||
        elementos.length === 0
    ) {

        return `

            <p>

                No hay información disponible.

            </p>

        `;

    }


    const etiqueta =
        numerada
        ?
        "ol"
        :
        "ul";


    return `

        <${etiqueta}>

            ${
                elementos
                    .map(
                        elemento =>

                        `<li>

                            ${escaparHTML(
                                elemento
                            )}

                        </li>`

                    )
                    .join("")
            }

        </${etiqueta}>

    `;

}


/*
=================================================
PROTEGER HTML
=======================================
