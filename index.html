<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scanner DTC Automotriz</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #080d18;
    color: #f8fafc;
}

.container {
    width: 100%;
    max-width: 750px;
    margin: auto;
}

header {
    text-align: center;
    margin-bottom: 25px;
}

h1 {
    margin-bottom: 5px;
    color: #ef4444;
}

.subtitle {
    margin: 0;
    color: #94a3b8;
    font-size: 14px;
}

.card {
    background: #151e2e;
    border: 1px solid #29364d;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,.25);
}

label {
    display: block;
    color: #94a3b8;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 7px;
}

input,
select {
    width: 100%;
    padding: 14px;
    margin-bottom: 15px;

    background: #0b1220;
    color: white;

    border: 1px solid #334155;
    border-radius: 9px;

    font-size: 16px;
    outline: none;
}

input:focus,
select:focus {
    border-color: #ef4444;
}

button {
    width: 100%;
    padding: 15px;

    border: none;
    border-radius: 9px;

    background: #ef4444;
    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

button:hover {
    background: #dc2626;
}

button:disabled {
    opacity: .6;
    cursor: wait;
}

#resultado {
    display: none;
}

.codigo {
    display: inline-block;

    background: #ef4444;
    color: white;

    padding: 8px 14px;

    border-radius: 8px;

    font-size: 25px;
    font-weight: bold;
}

.titulo {
    font-size: 21px;
    font-weight: bold;
    margin-top: 14px;
}

.marca {
    display: inline-block;

    margin-top: 10px;
    padding: 5px 9px;

    border-radius: 6px;

    background: #334155;
    color: #cbd5e1;

    font-size: 13px;
}

.gravedad {
    display: inline-block;

    margin-top: 10px;
    margin-left: 5px;

    padding: 5px 9px;

    border-radius: 6px;

    background: #f59e0b;
    color: #111827;

    font-size: 13px;
    font-weight: bold;
}

.seccion {
    margin-top: 22px;
}

.seccion h3 {
    color: #38bdf8;

    border-bottom: 1px solid #334155;

    padding-bottom: 7px;
}

.seccion p {
    color: #cbd5e1;
    line-height: 1.6;
}

ul,
ol {
    color: #cbd5e1;
    padding-left: 25px;
}

li {
    margin-bottom: 9px;
    line-height: 1.4;
}

.loading {
    text-align: center;
    color: #38bdf8;
    font-weight: bold;
}

.error {
    color: #f87171;
    font-weight: bold;
}

.warning {
    background: #422006;
    border: 1px solid #92400e;
    padding: 12px;
    border-radius: 8px;
    color: #fed7aa;
}

footer {
    text-align: center;
    color: #64748b;
    font-size: 12px;
    margin-top: 20px;
}

@media(max-width:600px) {

    body {
        padding: 12px;
    }

    .card {
        padding: 16px;
    }

    .titulo {
        font-size: 19px;
    }
}
</style>
</head>


<body>

<div class="container">

<header>

<h1>🚗 Scanner DTC</h1>

<p class="subtitle">
Diagnóstico de códigos de falla automotrices
</p>

</header>


<div class="card">

<label for="marca">
MARCA DEL VEHÍCULO
</label>

<select id="marca">

<option value="chevrolet">Chevrolet</option>
<option value="ford">Ford</option>
<option value="nissan">Nissan</option>
<option value="dodge">Dodge</option>
<option value="toyota">Toyota</option>
<option value="honda">Honda</option>
<option value="kia">Kia</option>
<option value="hyundai">Hyundai</option>
<option value="volkswagen">Volkswagen</option>
<option value="mazda">Mazda</option>
<option value="jeep">Jeep</option>
<option value="chrysler">Chrysler</option>
<option value="gmc">GMC</option>
<option value="cadillac">Cadillac</option>
<option value="buick">Buick</option>
<option value="lexus">Lexus</option>
<option value="infiniti">Infiniti</option>
<option value="acura">Acura</option>
<option value="subaru">Subaru</option>
<option value="mitsubishi">Mitsubishi</option>
<option value="volvo">Volvo</option>
<option value="audi">Audi</option>
<option value="bmw">BMW</option>
<option value="mercedes-benz">Mercedes-Benz</option>

</select>


<label for="codigo">
CÓDIGO DTC
</label>

<input
    id="codigo"
    type="text"
    placeholder="Ejemplo: P0420"
    maxlength="6"
    autocomplete="off"
    spellcheck="false"
>


<button id="buscarBtn" onclick="buscarCodigo()">
🔎 BUSCAR CÓDIGO
</button>

</div>


<div id="resultado" class="card"></div>


<footer>

Scanner DTC Automotriz © 2026

</footer>

</div>


<script>

/*
==================================================
CONFIGURACIÓN DE LA API
==================================================

Cuando creemos tu API cambiaremos esta dirección.

Ejemplo:

https://tu-api.vercel.app/api/dtc

*/

const API_URL = "https://TU-API.vercel.app/api/dtc";


async function buscarCodigo() {

    const codigoInput =
        document.getElementById("codigo");

    const marcaSelect =
        document.getElementById("marca");

    const resultado =
        document.getElementById("resultado");

    const boton =
        document.getElementById("buscarBtn");


    const codigo =
        codigoInput.value
        .trim()
        .toUpperCase();


    const marca =
        marcaSelect.value;


    /*
    ==============================================
    VALIDAR CÓDIGO
    ==============================================
    */

    if (!codigo) {

        mostrarError(
            "Escribe un código DTC, por ejemplo P0420."
        );

        return;
    }


    /*
    Los DTC normalmente tienen 5 caracteres.
    Ejemplo: P0420
    */

    if (!/^[PBCU][0-9A-F]{4}$/.test(codigo)) {

        mostrarError(
            "El código no tiene un formato DTC válido. Ejemplo: P0420, P0300 o C0035."
        );

        return;
    }


    /*
    ==============================================
    MOSTRAR CARGANDO
    ==============================================
    */

    resultado.style.display = "block";

    resultado.innerHTML = `

        <div class="loading">

            🔄 Consultando base de datos...

            <br><br>

            Código: ${codigo}

        </div>

    `;

    boton.disabled = true;


    try {

        /*
        ==========================================
        CONSULTAR API
        ==========================================
        */

        const url =
            `${API_URL}/${encodeURIComponent(codigo)}?make=${encodeURIComponent(marca)}`;


        const response =
            await fetch(url);


        /*
        ==========================================
        ERROR HTTP
        ==========================================
        */

        if (!response.ok) {

            if (response.status === 404) {

                mostrarNoEncontrado(
                    codigo,
                    marca
                );

                return;
            }

            throw new Error(
                `Error HTTP ${response.status}`
            );
        }


        /*
        ==========================================
        CONVERTIR RESPUESTA
        ==========================================
        */

        const data =
            await response.json();


        /*
        ==========================================
        MOSTRAR INFORMACIÓN
        ==========================================
        */

        mostrarResultado(
            data,
            codigo,
            marca
        );


    } catch (error) {

        console.error(error);

        resultado.style.display = "block";

        resultado.innerHTML = `

            <div class="error">

                ❌ No se pudo conectar con el servidor.

            </div>

            <br>

            <div class="warning">

                La API todavía no está conectada
                o el servidor no está disponible.

                <br><br>

                En el siguiente paso vamos a crear
                tu API.

            </div>

        `;

    } finally {

        boton.disabled = false;

    }

}


/*
==================================================
MOSTRAR RESULTADO
==================================================
*/

function mostrarResultado(
    data,
    codigo,
    marca
) {

    const resultado =
        document.getElementById("resultado");


    const causas =
        convertirLista(data.causes);

    const sintomas =
        convertirLista(data.symptoms);

    const diagnostico =
        convertirLista(data.diagnosis);

    const arreglos =
        convertirLista(data.repairs);


    resultado.style.display = "block";


    resultado.innerHTML = `

        <span class="codigo">
            ${escaparHTML(data.code || codigo)}
        </span>


        <div class="titulo">

            ${escaparHTML(
                data.title ||
                data.definition ||
                "Código DTC"
            )}

        </div>


        <span class="marca">

            🚗 ${escaparHTML(
                data.make || marca
            )}

        </span>


        ${
            data.severity
            ?
            `
            <span class="gravedad">

                ⚠️ ${escaparHTML(data.severity)}

            </span>
            `
            :
            ""
        }


        <div class="seccion">

            <h3>
                🔴 Problema
            </h3>

            <p>

                ${escaparHTML(
                    data.problem ||
                    data.description ||
                    "No hay descripción disponible."
                )}

            </p>

        </div>


        <div class="seccion">

            <h3>
                🔍 Causas posibles
            </h3>

            ${crearLista(causas)}

        </div>


        <div class="seccion">

            <h3>
                🚨 Síntomas
            </h3>

            ${crearLista(sintomas)}

        </div>


        <div class="seccion">

            <h3>
                🧪 Diagnóstico
            </h3>

            ${crearLista(diagnostico, true)}

        </div>


        <div class="seccion">

            <h3>
                🔧 Posibles arreglos
            </h3>

            ${crearLista(arreglos)}

        </div>

    `;

}


/*
==================================================
CÓDIGO NO ENCONTRADO
==================================================
*/

function mostrarNoEncontrado(
    codigo,
    marca
) {

    const resultado =
        document.getElementById("resultado");


    resultado.style.display = "block";


    resultado.innerHTML = `

        <span class="codigo">

            ${escaparHTML(codigo)}

        </span>


        <div class="titulo">

            Código no encontrado

        </div>


        <p>

            No encontramos información para
            <strong>${escaparHTML(codigo)}</strong>
            en la base de datos de
            <strong>${escaparHTML(marca)}</strong>.

        </p>


        <div class="warning">

            💡 Puede tratarse de un código
            específico del fabricante o de un
            código que todavía no está incluido
            en nuestra base de datos.

        </div>

    `;

}


/*
==================================================
 ERROR
==================================================
*/

function mostrarError(mensaje) {

    const resultado =
        document.getElementById("resultado");


    resultado.style.display = "block";


    resultado.innerHTML = `

        <div class="error">

            ⚠️ ${escaparHTML(mensaje)}

        </div>

    `;

}


/*
==================================================
 CONVERTIR LISTAS
==================================================
*/

function convertirLista(valor) {

    if (!valor) {
        return [];
    }


    if (Array.isArray(valor)) {
        return valor;
    }


    if (typeof valor === "string") {

        return valor
            .split("\n")
            .map(x => x.trim())
            .filter(Boolean);

    }


    return [];

}


/*
==================================================
 CREAR LISTA HTML
==================================================
*/

function crearLista(
    elementos,
    numerada = false
) {

    if (!elementos.length) {

        return `
            <p>
                No hay información disponible.
            </p>
        `;

    }


    const etiqueta =
        numerada ? "ol" : "ul";


    return `

        <${etiqueta}>

            ${elementos
                .map(
                    elemento =>
                    `<li>${escaparHTML(elemento)}</li>`
                )
                .join("")
            }

        </${etiqueta}>

    `;

}


/*
==================================================
 PROTECCIÓN HTML
==================================================

Evita que texto recibido desde la API
pueda convertirse accidentalmente en HTML.

==================================================
*/

function escaparHTML(texto) {

    if (texto === null ||
        texto === undefined) {

        return "";

    }


    return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/*
==================================================
 ENTER = BUSCAR
==================================================
*/

document
    .getElementById("codigo")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                buscarCodigo();

            }

        }
    );

</script>

</body>
                         </html>
